[build]
builder = "RAILPACK"
buildCommand = "pnpm build:server"
watchPatterns = [
  "/src/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/tsup.config.ts",
]

[deploy]
startCommand = "pnpm start:mcp"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
