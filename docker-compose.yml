services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5433:5432'
    environment:
      # Existing local volumes were initialized with these database credentials.
      POSTGRES_USER: bank_data
      POSTGRES_PASSWORD: bank_data
      POSTGRES_DB: bank_data
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
